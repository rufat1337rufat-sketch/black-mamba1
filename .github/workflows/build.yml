name: Build Capacitor APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies & build web app
      run: |
        cd black-mamba-apk/black-mamba-apk
        npm install
        npm run build || true

    - name: Add Android platform and build APK
      run: |
        cd black-mamba-apk/black-mamba-apk
        npx cap init --force
        npx cap add android
        npx cap sync android
        cd android
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: black-mamba-apk/black-mamba-apk/android/app/build/outputs/apk/debug/app-debug.apk
